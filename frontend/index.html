<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake-Real Detector — Scam & Legitimacy Checker</title>
  <link rel="icon" type="image/gif" href="/favicon.gif">
  <link rel="stylesheet" href="/dist/output.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen antialiased">
  <div class="max-w-3xl mx-auto px-4 py-12">
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900">
        Fake-Real Detector
      </h1>
      <p class="mt-3 text-base sm:text-lg text-gray-600">
        Check internship offers, scholarship links, and messages for scam patterns and trust signals.
      </p>
    </header>

    <!-- Main Input Card -->
    <main class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 sm:p-8">
      <form id="detector-form" class="space-y-4">
        <div>
          <label for="content-input" class="block text-sm font-medium text-gray-700 mb-2">
            Paste offer, email, message, or URL
          </label>
          <textarea
            id="content-input"
            name="content"
            rows="6"
            class="w-full rounded-lg border border-gray-300 p-3 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none placeholder-gray-400"
            placeholder="e.g. 'Urgent hiring! Earn $1200 per week. Pay $50 registration fee and interview on Telegram...'"
          ></textarea>
        </div>

        <div class="flex items-center justify-between pt-2">
          <span class="text-xs text-gray-500">
            Evaluates red flags, payment demands, and verified institutional domains.
          </span>
          <button
            id="check-button"
            type="submit"
            class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm"
          >
            Check Offer
          </button>
        </div>
      </form>

      <!-- Results Shell (Initially hidden, revealed when analysis completes) -->
      <section id="results-section" class="hidden mt-8 pt-8 border-t border-gray-200" aria-live="polite">
        <!-- Score & Verdict Header -->
        <div class="flex items-center justify-between">
          <span id="verdict-badge" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-semibold border"></span>
          <span id="score-label" class="text-xs font-medium text-gray-500"></span>
        </div>

        <!-- Summary -->
        <p id="summary-text" class="text-gray-700 mt-3 text-base leading-relaxed"></p>

        <!-- Two-column findings section -->
        <div id="findings-container" class="mt-6">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-3">
            Analysis Findings & Evidence
          </h2>
          <div id="findings-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamically populated by presenter.ts -->
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-gray-500">
      <p>Fake-Real Detector &bull; Heuristic & AI-Assisted Safety Intelligence</p>
    </footer>
  </div>

  <script type="module" src="/dist/app.js"></script>
</body>
</html>
