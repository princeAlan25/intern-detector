<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816.824 522.45" width="816.824" height="522.45" style="--bg:#FFFFFF;--fg:#3B3B3B;--line:#3B3B3B;--accent:#005FB8;--muted:#3B3B3BCC;--surface:#F8F8F8;--border:#3B3B3B;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="User" x1="70" y1="92.45" x2="70" y2="492.45000000000005" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Frontend" x1="235.147" y1="70" x2="235.147" y2="492.45000000000005" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Server" x1="435.4375" y1="70" x2="435.4375" y2="492.45000000000005" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Analyzer" x1="668.7025" y1="70" x2="668.7025" y2="492.45000000000005" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="User" data-to="Frontend" data-label="Types/Pastes text &amp; clicks &quot;Check&quot;" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="112.45" x2="235.147" y2="112.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="152.5735" y="102.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Types/Pastes text &amp; clicks &quot;Check&quot;</text>
</g>
<g class="message" data-from="Frontend" data-to="Frontend" data-label="Checks if input is empty (if empty, do nothing)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="235.147,152.45 265.147,152.45 265.147,172.45 235.147,172.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="273.147" y="162.45" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Checks if input is empty (if empty, do nothing)</text>
</g>
<g class="message" data-from="Frontend" data-to="Server" data-label="POST /api/analyze { content: &quot;...&quot; }" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="235.147" y1="222.45" x2="435.4375" y2="222.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="335.29224999999997" y="212.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">POST /api/analyze { content: &quot;...&quot; }</text>
</g>
<g class="message" data-from="Server" data-to="Analyzer" data-label="analyzeContent(content)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="435.4375" y1="262.45" x2="668.7025" y2="262.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="552.0699999999999" y="252.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">analyzeContent(content)</text>
</g>
<g class="message" data-from="Analyzer" data-to="Server" data-label="Returns structured JSON (score, summary, reasons, evidence)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="668.7025" y1="302.45" x2="435.4375" y2="302.45" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="552.0699999999999" y="292.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Returns structured JSON (score, summary, reasons, evidence)</text>
</g>
<g class="message" data-from="Server" data-to="Frontend" data-label="200 OK with JSON response" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="435.4375" y1="342.45" x2="235.147" y2="342.45" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="335.29224999999997" y="332.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">200 OK with JSON response</text>
</g>
<g class="message" data-from="Frontend" data-to="Frontend" data-label="Renders color-coded score, summary, &amp; 2-column table" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="235.147,382.45 265.147,382.45 265.147,402.45 235.147,402.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="273.147" y="392.45" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Renders color-coded score, summary, &amp; 2-column table</text>
</g>
<g class="message" data-from="Frontend" data-to="User" data-label="Displays results" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="235.147" y1="452.45" x2="70" y2="452.45" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="152.5735" y="442.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Displays results</text>
</g>
<g class="actor" data-id="User" data-label="User" data-type="actor">
  <g transform="translate(52,32) scale(1.5)">
    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M15 10C15 11.6569 13.6569 13 12 13C10.3431 13 9 11.6569 9 10C9 8.34315 10.3431 7 12 7C13.6569 7 15 8.34315 15 10Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M5.62842 18.3563C7.08963 17.0398 9.39997 16 12 16C14.6 16 16.9104 17.0398 18.3716 18.3563" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
  </g>
  <text x="70" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">User</text>
</g>
<g class="actor" data-id="Frontend" data-label="Browser (public/app.js)" data-type="participant">
  <rect x="150" y="30" width="170.29399999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="235.147" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Browser (public/app.js)</text>
</g>
<g class="actor" data-id="Server" data-label="Express (server.js)" data-type="participant">
  <rect x="360.294" y="30" width="150.287" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="435.4375" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Express (server.js)</text>
</g>
<g class="actor" data-id="Analyzer" data-label="AI Analyzer (services/analyzer.js)" data-type="participant">
  <rect x="550.581" y="30" width="236.243" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="668.7025" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">AI Analyzer (services/analyzer.js)</text>
</g>
</svg>